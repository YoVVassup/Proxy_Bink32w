[log]
; enabled = false
; wait = true

; NOTE: [exception] must be listed BEFORE all mix sections ([movies01], ...),
; otherwise the mix sections are ignored and a warning is logged
; (WARNING: section [name] ignored — no matching entry in [exception]).
;
; Entry syntax:
;   0=movies01.mix              — auto-resolve disabled; only explicit
;                                 [movies01] maps below are used
;   0=movies01.mix|BinkWAV\RA2  — auto: BinkWAV\RA2\<stem>.ogg, then
;                                 BinkWAV\RA2\<stem>.wav (existence-checked)
;                                 Explicit map in [movies01] still wins.
; Without | after the mix name — baseDir is empty, auto-resolve is skipped.
;
; Quick audio pack swap: change only the path after |.
[exception]
; RA2 movies — auto BinkWAV\RA2\<stem>.ogg / .wav
0=movies01.mix|BinkWAV\RA2
1=movies02.mix|BinkWAV\RA2
; RA2YR movies — auto BinkWAV\RA2YR\<stem>.ogg / .wav
2=movmd03.mix|BinkWAV\RA2YR

; Explicit maps override the base dir — only needed when a file name
; does not match the .bik stem:
; [movies01]
; special.bik = Other\special.wav

[audio]
; Global fallback (used when no exception match)
